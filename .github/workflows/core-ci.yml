name: Simulation core CI
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build simulation core
        run: dotnet build src/WorldSim/WorldSim.csproj -c Release
      - name: Run deterministic smoke tests
        run: dotnet run --project tests/WorldSim.Smoke/WorldSim.Smoke.csproj -c Release
      - name: Camera math deterministic smoke tests
        run: dotnet run --project tests/CameraMath.Smoke/CameraMath.Smoke.csproj -c Release
      - name: Dirty terrain bounds and coalescing smoke tests
        run: dotnet run --project tests/DirtyTileRegion.Smoke/DirtyTileRegion.Smoke.csproj -c Release
      - name: Original terrain pixel art and coastline smoke tests
        run: dotnet run --project tests/TerrainPixelArt.Smoke/TerrainPixelArt.Smoke.csproj -c Release
      - name: Deterministic 64x64 world region and snapshot tests
        run: dotnet run --project tests/WorldRegion.Smoke/WorldRegion.Smoke.csproj -c Release
      - name: Screen-ray 3D camera and terrain DDA tests
        run: dotnet run --project tests/Camera3D.Smoke/Camera3D.Smoke.csproj -c Release
      - name: Frame timing ring buffer and percentile tests
        run: dotnet run --project tests/FrameTime.Smoke/FrameTime.Smoke.csproj -c Release
      - name: Viewport-driven chunk residency tests
        run: dotnet run --project tests/VisibleChunks.Smoke/VisibleChunks.Smoke.csproj -c Release
      - name: Authored nature species scatter tests
        run: dotnet run --project tests/NatureScatter.Smoke/NatureScatter.Smoke.csproj -c Release
      - name: Validate bundled CC0 GLB asset headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          folder = Path("Assets/Art/KenneyNature")
          paths = sorted(folder.glob("*.glb"))
          assert len(paths) == 10, f"Expected 10 original CC0 model GLBs, got {len(paths)}"
          for path in paths:
              data = path.read_bytes()
              assert len(data) > 1000 and data[:4] == b"glTF", str(path)
              assert int.from_bytes(data[4:8], "little") == 2, str(path)
              assert int.from_bytes(data[8:12], "little") == len(data), str(path)
              assert data[16:20] == b"JSON", str(path)
          print("PASS: 10 structurally valid CC0 glTF2 binary models")
          PY
      - name: Environment biome blending and live shoreline mask tests
        run: dotnet run --project tests/EnvironmentArt.Smoke/EnvironmentArt.Smoke.csproj -c Release
      - name: Low-cost water, coast gradient and bounded chunk loading tests
        run: dotnet run --project tests/WaterAndStreaming.Smoke/WaterAndStreaming.Smoke.csproj -c Release
      - name: Sculpted terrain facet geometry and exact picker tests
        run: dotnet run --project tests/TerrainRelief.Smoke/TerrainRelief.Smoke.csproj -c Release
      - name: Continuous shared-corner terrain, brush seams and exact picker tests
        run: dotnet run --project tests/SharedHeightfield.Smoke/SharedHeightfield.Smoke.csproj -c Release
      - name: Editable regional elevation, checksummed disk save and recovery tests
        run: dotnet run --project tests/ElevationRegion.Smoke/ElevationRegion.Smoke.csproj -c Release
      - name: 8192 logical region-world LRU and persistent biome tests
        run: dotnet run --project tests/RegionalWorld.Smoke/RegionalWorld.Smoke.csproj -c Release
      - name: Guard approved V2 default from rejected V3 experimental scene
        run: python3 tests/ReleaseGuard.Smoke/verify.py
      - name: Approved V2 renderer region-mirror exact parity and LRU smoke
        run: dotnet run --project tests/TerrainBackendParity.Smoke/TerrainBackendParity.Smoke.csproj -c Release
      - name: Build Godot C# project (compilation only)
        run: dotnet build WorldForgeSim.csproj -c Debug --disable-build-servers -p:UseSharedCompilation=false
