name: V2 visual lab engine integration
on:
  pull_request:
    paths:
      - 'Scripts/**'
      - 'src/**'
      - 'Scenes/**'
      - 'Assets/**'
      - 'scripts/**'
      - 'tests/TerrainBackendParity.Smoke/**'
      - 'tests/FrameTime.Smoke/**'
      - 'tests/AcceptanceBundle.Smoke/**'
      - 'WorldForgeSim.csproj'
      - 'global.json'
      - 'project.godot'
      - '.github/workflows/visual-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download official Godot 4.7.2 Mono Linux editor
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2-godot"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            -o "$RUNNER_TEMP/v2-godot/editor.zip"
          unzip -q "$RUNNER_TEMP/v2-godot/editor.zip" -d "$RUNNER_TEMP/v2-godot"
          GODOT=$(find "$RUNNER_TEMP/v2-godot" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' | head -n 1)
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version
      - name: Record worktree before Godot import
        shell: pwsh
        run: |
          . ./scripts/acceptance-worktree.ps1
          $state = Get-AcceptanceWorktreeState -Root $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Path ./artifacts/acceptance/ci -Force | Out-Null
          $state | ConvertTo-Json -Depth 8 | Set-Content ./artifacts/acceptance/ci/worktree-before-import.json
          Export-AcceptanceSidecars -Root $env:GITHUB_WORKSPACE -State $state -Directory ./artifacts/acceptance/ci/godot-sidecars/before-import
      - name: Import bundled CC0 models and compile scene assets
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --editor --import \
            --rendering-method gl_compatibility
      - name: Build WorldForge C# after import
        run: dotnet build WorldForgeSim.csproj -c Debug --disable-build-servers -p:UseSharedCompilation=false
      - name: Freeze actual imported Godot sidecar identity
        shell: pwsh
        run: |
          . ./scripts/acceptance-worktree.ps1
          $before = Get-Content ./artifacts/acceptance/ci/worktree-before-import.json -Raw | ConvertFrom-Json
          $prepared = Get-AcceptanceWorktreeState -Root $env:GITHUB_WORKSPACE
          Assert-AcceptanceWorktreeStable -Baseline $before -Current $prepared -AllowSidecarRefresh
          if (@($prepared.godot_sidecars | Where-Object path -CLike '*.glb.import').Count -ne 10) { throw 'Expected actual import metadata for all 10 tracked GLBs.' }
          $prepared | ConvertTo-Json -Depth 8 | Set-Content ./artifacts/acceptance/ci/worktree-prepared.json
          Export-AcceptanceSidecars -Root $env:GITHUB_WORKSPACE -State $prepared -Directory ./artifacts/acceptance/ci/godot-sidecars/capture
          Write-Host "PASS actual Godot import metadata recorded: $($prepared.godot_sidecars.Count) companions"
      - name: Start standalone V2 scene without editor
        run: |
          set -euo pipefail
          timeout 70s "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --scene res://Scenes/VisualLab3D.tscn --quit-after 24 \
            --rendering-method gl_compatibility
      - name: Start approved V2 camera, water and nature with region-mirror backend
        run: |
          set -euo pipefail
          timeout 70s "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --scene res://Scenes/VisualLab3D.tscn --quit-after 24 \
            --rendering-method gl_compatibility \
            -- --terrain-backend=region-mirror 2>&1 | tee "$RUNNER_TEMP/parity-scene.log"
          grep -F 'terrain source = region-mirror' "$RUNNER_TEMP/parity-scene.log"
      - name: Replay exact user mountain screenshot seed in approved V2 scene
        run: |
          set -euo pipefail
          timeout 70s "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --scene res://Scenes/VisualLab3D.tscn --quit-after 24 \
            --rendering-method gl_compatibility \
            -- --world-seed=1315511732 2>&1 | tee "$RUNNER_TEMP/mountain-reference.log"
          grep -F 'V2 reference world seed: 1315511732' "$RUNNER_TEMP/mountain-reference.log"
      - name: Replay reference seed with region-mirror in the same V2 scene
        run: |
          set -euo pipefail
          timeout 70s "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --scene res://Scenes/VisualLab3D.tscn --quit-after 24 \
            --rendering-method gl_compatibility \
            -- --terrain-backend=region-mirror --world-seed=1315511732 \
            2>&1 | tee "$RUNNER_TEMP/mirror-reference.log"
          grep -F 'terrain source = region-mirror' "$RUNNER_TEMP/mirror-reference.log"
          grep -F 'V2 reference world seed: 1315511732' "$RUNNER_TEMP/mirror-reference.log"
      - name: Start 8192 logical regional 3D scene headlessly
        run: |
          set -euo pipefail
          timeout 70s "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --scene res://Scenes/RegionalWorldLab3D.tscn --quit-after 24 \
            --rendering-method gl_compatibility

      - name: Capture four monotonic scenarios with both V2 data backends
        run: |
          set -euo pipefail
          for scenario in idle pan zoom paint; do
            for backend in direct region-mirror; do
              target="$GITHUB_WORKSPACE/artifacts/acceptance/ci/$scenario-$backend"
              mkdir -p "$target"
              timeout 50s "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
                --scene res://Scenes/VisualLab3D.tscn --rendering-method gl_compatibility \
                --resolution 1280x800 --max-fps 120 --log-file "$target/godot.log" \
                -- --world-seed=1315511732 --terrain-backend="$backend" \
                --acceptance-session="ci-$scenario" --acceptance-scenario="$scenario" \
                --acceptance-output="$target" --acceptance-duration=1.1 \
                --acceptance-warmup=0.1 --acceptance-quality=Eco
            done
          done
      - name: Validate actual frame windows, statistics, camera traces and scenario identity
        shell: pwsh
        run: ./tests/AcceptanceBundle.Smoke/verify-engine.ps1 -Directory ./artifacts/acceptance/ci -WorktreeBaseline ./artifacts/acceptance/ci/worktree-prepared.json
